[project]
name = "masspec"
version = "0.1.0"
description = "MASSPEC (Dayhoff and Eck, 1970) reverse-engineered from the paper, and taken to present-day data"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
real = ["pyteomics>=4.7", "psims>=1.3", "lxml>=5", "numpy>=1.26"]

[project.scripts]
masspec = "masspec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masspec"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
notebook = ["jupyter>=1.1", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29", "matplotlib>=3.9"]

[tool.ruff]
line-length = 79                      # PEP 8
target-version = "py311"

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, pep8-naming, import order, docstrings' basics
select = ["E", "W", "F", "N", "I", "E731"]
