[project]
name = "masspec"
version = "0.1.0"
description = "MASSPEC (Dayhoff and Eck, 1970) reverse-engineered from the paper, and taken to present-day data"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
real = ["pyteomics>=4.7", "lxml>=5", "numpy>=1.26"]

[project.scripts]
masspec = "masspec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masspec"]

[dependency-groups]
dev = ["pytest>=8"]
